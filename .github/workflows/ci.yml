name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "opencode.json"
            "docs/ARCHITECTURE.md"
            "docs/FRONTEND.md"
            "docs/BACKEND.md"
            "docs/SIMULATION.md"
            "docs/RECOGNITION.md"
            "docs/DEVOPS.md"
            ".opencode/agents/architect.md"
            ".opencode/agents/frontend.md"
            ".opencode/agents/backend.md"
            ".opencode/agents/simulation.md"
            ".opencode/agents/recognition.md"
            ".opencode/agents/reviewer.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for directory in frontend backend workers; do
            test -d "$directory" || { echo "Missing required directory: $directory"; exit 1; }
          done

      - name: Validate OpenCode configuration
        run: python -m json.tool opencode.json > /dev/null

      - name: Check whitespace errors
        run: git diff --check
