name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "opencode.json"
            "docs/ARCHITECTURE.md"
            "docs/FRONTEND.md"
            "docs/BACKEND.md"
            "docs/SIMULATION.md"
            "docs/RECOGNITION.md"
            "docs/DEVOPS.md"
            ".opencode/agents/architect.md"
            ".opencode/agents/frontend.md"
            ".opencode/agents/backend.md"
            ".opencode/agents/simulation.md"
            ".opencode/agents/recognition.md"
            ".opencode/agents/reviewer.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          for directory in frontend backend workers; do
            test -d "$directory" || { echo "Missing required directory: $directory"; exit 1; }
          done

      - name: Validate OpenCode configuration
        run: python -c "import json; from pathlib import Path; json.loads(Path('opencode.json').read_text(encoding='utf-8-sig'))"

      - name: Check whitespace errors
        run: git diff --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend/FurnaView.Api.Tests/FurnaView.Api.Tests.csproj

      - name: Build backend
        run: dotnet build backend/FurnaView.Api/FurnaView.Api.csproj --no-restore

      - name: Test backend
        run: dotnet test backend/FurnaView.Api.Tests/FurnaView.Api.Tests.csproj --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
