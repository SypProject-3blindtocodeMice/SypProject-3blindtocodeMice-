name: Branch Policy

on:
  pull_request:

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" == "main" && "$HEAD" != "dev" ]]; then
            echo "::error::Only dev can merge into main"
            exit 1
          fi

          if [[ "$BASE" == "dev" && "$HEAD" == "main" ]]; then
            echo "::error::Do not merge main into dev via this workflow"
            exit 1
          fi
